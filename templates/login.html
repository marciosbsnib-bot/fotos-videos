{% extends "base.html" %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="brand large"><span class="brand-mark">M</span> Meu Espaço</div>
    <p class="muted">Fotos · Vídeos · Memórias</p>
    <h1>Entrar</h1>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>E-mail</label>
      <input name="email" type="email" required autocomplete="email">
      <label>Senha</label>
      <input name="password" type="password" required autocomplete="current-password">
      <button class="primary">Entrar</button>
    </form>
    <div class="or">ou</div>
    <a class="google-btn" href="{{ url_for('google.google_login') }}">Entrar com Google</a>
    <details class="register">
      <summary>Criar conta</summary>
      <form method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nome</label>
        <input name="name" required>
        <label>E-mail</label>
        <input name="email" type="email" required>
        <label>Senha</label>
        <input name="password" type="password" minlength="8" required>
        <button class="secondary">Criar conta</button>
      </form>
    </details>
    <p class="tiny">Novos cadastros precisam ser aprovados pelo administrador.</p>
  </div>
</div>
{% endblock %}
