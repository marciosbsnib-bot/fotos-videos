{% extends "base.html" %}
{% block content %}
<header class="topbar"><div><h1>Álbuns / Pastas</h1><p class="muted">Classifique o conteúdo por nível de acesso.</p></div></header>
<form class="create-form" method="post" style="display: flex; gap: 10px; width: 100%;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" placeholder="Nome do álbum" required style="flex-grow: 1;">
<select name="classification"><option value="PUBLIC">Público</option><option value="NORMAL">Normal</option><option value="RESTRICTED">Restrito</option></select>
<button class="primary">+ Criar álbum</button>
</form>

<div class="table-wrap"><table style="width: 100%;">
<tr><th style="width: 50%;">Álbum</th><th>Classificação</th><th>Ações</th></tr>
{% for a in albums %}
<tr>
<td>
  <form method="post" action="{{ url_for('admin_rename_album', album_id=a.id) }}" style="display: flex; gap: 8px; width: 100%;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="name" value="{{ a.name }}" required style="flex-grow: 1; padding: 4px 8px;">
    <button class="small secondary">Renomear</button>
  </form>
</td>
<td>{{ a.access_classification }}</td>
<td>
  <form class="inline" method="post" action="{{ url_for('admin_album_classification', album_id=a.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <select name="classification">
      <option value="PUBLIC" {% if a.access_classification=="PUBLIC" %}selected{% endif %}>Público</option>
      <option value="NORMAL" {% if a.access_classification=="NORMAL" %}selected{% endif %}>Normal</option>
      <option value="RESTRICTED" {% if a.access_classification=="RESTRICTED" %}selected{% endif %}>Restrito</option>
    </select>
    <button class="small secondary">Salvar</button>
  </form>
  <form class="inline" method="post" action="{{ url_for('admin_delete_album', album_id=a.id) }}" onsubmit="return confirm('Tem certeza que deseja deletar este álbum do site?');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="small danger" style="background-color: #d9534f; color: white;">Deletar</button>
  </form>
</td>
</tr>
{% endfor %}
</table></div>
{% endblock %}
