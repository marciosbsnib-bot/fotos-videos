{% extends "base.html" %}
{% block content %}
<header class="topbar"><div><h1>Álbuns / Pastas</h1><p class="muted">Classifique o conteúdo por nível de acesso.</p></div></header>
<form class="create-form" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" placeholder="Nome do álbum" required>
<select name="classification"><option value="PUBLIC">Público</option><option value="NORMAL">Normal</option><option value="RESTRICTED">Restrito</option></select>
<button class="primary">+ Criar álbum</button>
</form>
<div class="table-wrap"><table>
<tr><th>Álbum</th><th>Classificação</th><th>Ação</th></tr>
{% for a in albums %}
<tr><td>{{ a.name }}</td><td>{{ a.access_classification }}</td><td>
<form class="inline" method="post" action="{{ url_for('admin_album_classification', album_id=a.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<select name="classification"><option value="PUBLIC">Público</option><option value="NORMAL">Normal</option><option value="RESTRICTED">Restrito</option></select>
<button class="small secondary">Salvar</button>
</form></td></tr>
{% endfor %}
</table></div>
{% endblock %}
